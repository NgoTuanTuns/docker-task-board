map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Docker's embedded DNS is queried at runtime so Nginx discovers app replicas
# added/removed by `docker compose --scale app=N` without a manual restart.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream task_board_app {
    zone task_board_app 64k;
    least_conn;
    server app:3000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location / {
        proxy_pass http://task_board_app;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
