<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Docker Task Board</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #f4f5f7;
        color: #172b4d;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 20px;
        background: #0b5cad;
        color: #fff;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
        flex: 1;
      }
      main {
        padding: 20px;
      }
      .hidden {
        display: none !important;
      }
      #authBox {
        max-width: 320px;
        margin: 60px auto;
        background: #fff;
        padding: 24px;
        border-radius: 8px;
      }
      #authBox input {
        width: 100%;
        padding: 8px;
        margin: 6px 0;
      }
      #authBox .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      #authError {
        color: #c9372c;
        min-height: 1.2em;
        font-size: 14px;
      }
      #toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      #board {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        overflow-x: auto;
      }
      .column {
        background: #ebecf0;
        border-radius: 8px;
        padding: 10px;
        width: 280px;
        flex-shrink: 0;
      }
      .column h3 {
        margin: 4px 4px 10px;
        font-size: 14px;
        text-transform: uppercase;
      }
      .card {
        background: #fff;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .actions {
        margin-top: 6px;
        display: flex;
        gap: 4px;
      }
      .add {
        display: flex;
        gap: 4px;
        margin-top: 6px;
      }
      .add input {
        flex: 1;
        padding: 6px;
        min-width: 0;
      }
      button {
        cursor: pointer;
        padding: 4px 10px;
      }
      #live {
        font-size: 13px;
      }
      #host {
        font-size: 12px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Docker Task Board</h1>
      <span id="host"></span>
      <span id="live"></span>
      <span id="who"></span>
      <button id="logoutBtn" class="hidden">Logout</button>
    </header>

    <div id="authBox">
      <h3>Sign in</h3>
      <input
        id="email"
        type="email"
        placeholder="Email"
        value="admin@example.com"
      />
      <input
        id="password"
        type="password"
        placeholder="Password"
        value="admin123"
      />
      <div id="authError"></div>
      <div class="row">
        <button id="loginBtn">Login</button>
        <button id="registerBtn">Register</button>
      </div>
    </div>

    <main id="app" class="hidden">
      <div id="toolbar">
        <select id="boardSelect"></select>
        <button id="newBoardBtn">+ New board</button>
        <button id="deleteBoardBtn">Delete board</button>
      </div>
      <div id="board"></div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      let token = localStorage.getItem("token");
      let user = JSON.parse(localStorage.getItem("user") || "null");
      let socket = null;
      let currentBoard = null;

      const $ = (id) => document.getElementById(id);
      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }
      function btn(label, onClick, type = "button") {
        const b = el("button", "", label);
        b.type = type;
        if (onClick) b.onclick = onClick;
        return b;
      }

      async function api(path, method = "GET", body) {
        const res = await fetch("/api" + path, {
          method,
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: "Bearer " + token } : {}),
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (res.status === 401 && !path.startsWith("/auth/")) {
          logout();
          throw new Error("Session expired");
        }
        if (res.status === 204) return null;
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        return data;
      }

      // Bắt lỗi chung: hiện alert (ví dụ 403 khi xóa board của người khác)
      const run =
        (fn) =>
        async (...a) => {
          try {
            await fn(...a);
          } catch (e) {
            alert(e.message);
          }
        };

      // ---- Auth ----
      async function auth(kind) {
        try {
          const data = await api("/auth/" + kind, "POST", {
            email: $("email").value,
            password: $("password").value,
          });
          token = data.token;
          user = data.user;
          localStorage.setItem("token", token);
          localStorage.setItem("user", JSON.stringify(user));
          showApp();
        } catch (e) {
          $("authError").textContent = e.message;
        }
      }

      function logout() {
        token = null;
        user = null;
        currentBoard = null;
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        if (socket) {
          socket.disconnect();
          socket = null;
        }
        $("authBox").classList.remove("hidden");
        $("app").classList.add("hidden");
        $("logoutBtn").classList.add("hidden");
        $("who").textContent = "";
        $("live").textContent = "";
      }

      function showApp() {
        $("authBox").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("logoutBtn").classList.remove("hidden");
        $("who").textContent = `${user.email} (${user.role})`;
        connectSocket();
        loadBoards().catch((e) => alert(e.message));
      }

      // ---- Real-time ----
      function connectSocket() {
        if (socket) socket.disconnect();
        socket = io({ auth: { token }, transports: ["websocket"] });
        socket.on("connect", () => {
          $("live").textContent = "● live";
          if (currentBoard) socket.emit("board:join", currentBoard);
        });
        socket.on("disconnect", () => {
          $("live").textContent = "○ offline";
        });
        [
          "task:created",
          "task:updated",
          "task:deleted",
          "column:created",
          "column:deleted",
        ].forEach((ev) =>
          socket.on(ev, () => {
            if (currentBoard) loadBoard(currentBoard).catch(() => {});
          }),
        );
      }

      // ---- Boards ----
      async function loadBoards(selectId) {
        const boards = await api("/boards");
        const sel = $("boardSelect");
        sel.replaceChildren();
        boards.forEach((b) => {
          const o = el("option", "", b.name);
          o.value = b.id;
          sel.append(o);
        });
        const id = selectId || currentBoard || (boards[0] && boards[0].id);
        if (id) {
          sel.value = id;
          await selectBoard(id);
        } else {
          $("board").replaceChildren();
          currentBoard = null;
        }
      }

      async function selectBoard(id) {
        if (currentBoard && socket) socket.emit("board:leave", currentBoard);
        currentBoard = Number(id);
        if (socket) socket.emit("board:join", currentBoard);
        await loadBoard(currentBoard);
      }

      async function loadBoard(id) {
        const board = await api("/boards/" + id);
        const root = $("board");
        root.replaceChildren();
        const cols = board.columns;
        cols.forEach((col, i) => {
          const colEl = el("div", "column");
          colEl.append(el("h3", "", col.name));
          col.tasks.forEach((t) => {
            const card = el("div", "card");
            card.append(el("div", "", t.title));
            const actions = el("div", "actions");
            if (i > 0)
              actions.append(
                btn(
                  "◀",
                  run(() => moveTask(t.id, cols[i - 1].id)),
                ),
              );
            if (i < cols.length - 1)
              actions.append(
                btn(
                  "▶",
                  run(() => moveTask(t.id, cols[i + 1].id)),
                ),
              );
            actions.append(
              btn(
                "✕",
                run(() => removeTask(t.id)),
              ),
            );
            card.append(actions);
            colEl.append(card);
          });
          const form = el("form", "add");
          const input = el("input");
          input.placeholder = "New task";
          input.required = true;
          form.append(input, btn("+", null, "submit"));
          form.onsubmit = run(async (e) => {
            e.preventDefault();
            await api("/tasks", "POST", {
              column_id: col.id,
              title: input.value,
            });
            await loadBoard(currentBoard);
          });
          colEl.append(form);
          root.append(colEl);
        });
      }

      async function moveTask(id, columnId) {
        await api("/tasks/" + id, "PATCH", { column_id: columnId });
        await loadBoard(currentBoard);
      }
      async function removeTask(id) {
        await api("/tasks/" + id, "DELETE");
        await loadBoard(currentBoard);
      }

      // ---- Events ----
      $("loginBtn").onclick = () => auth("login");
      $("registerBtn").onclick = () => auth("register");
      $("logoutBtn").onclick = logout;
      $("boardSelect").onchange = run((e) => selectBoard(e.target.value));
      $("newBoardBtn").onclick = run(async () => {
        const name = prompt("Board name?");
        if (!name) return;
        const b = await api("/boards", "POST", { name });
        await loadBoards(b.id);
      });
      $("deleteBoardBtn").onclick = run(async () => {
        if (!currentBoard || !confirm("Delete this board?")) return;
        await api("/boards/" + currentBoard, "DELETE");
        currentBoard = null;
        await loadBoards();
      });

      // Hiển thị container nào phục vụ (hữu ích khi Phase 2 có nhiều replica)
      fetch("/health")
        .then((r) => r.json())
        .then((d) => {
          $("host").textContent = "served by: " + d.host;
        })
        .catch(() => {});

      if (token && user) showApp();
    </script>
  </body>
</html>
